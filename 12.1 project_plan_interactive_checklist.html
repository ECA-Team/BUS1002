<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Plan Checklist</title>
<style>
:root{--dark:#424236;--light:#f9f7ea}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,sans-serif;background:var(--light);color:var(--dark)}
.container{max-width:940px;margin:0 auto;background:#fff;border:2px solid var(--dark);border-radius:12px;padding:20px}
h1{margin:0 0 10px;text-align:center;font-size:1.5rem;color:var(--dark)}
.instructions{background:var(--light);border-left:5px solid var(--dark);border-radius:8px;padding:10px 13px;margin-bottom:16px;line-height:1.5}
.progress-wrap{margin-bottom:16px}
.progress-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:7px;font-size:.95rem}
.progress-track{height:9px;background:rgba(66,66,54,.18);border-radius:999px;overflow:hidden}
.progress-bar{height:100%;width:0;background:var(--dark);transition:width .2s ease}
.checklist{display:grid;gap:11px}
.check-item{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid rgba(66,66,54,.35);border-radius:10px;background:#fff}
.check-item.complete{background:var(--light);border-color:var(--dark)}
.check-item input{width:22px;height:22px;margin-top:1px;flex:0 0 auto;accent-color:var(--dark);cursor:pointer}
.check-item label{line-height:1.5;cursor:pointer}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border-radius:8px;padding:11px 17px;min-height:44px;font-size:1rem;cursor:pointer;border:2px solid var(--dark)}
.primary{background:var(--dark);color:var(--light)}
.secondary{background:var(--light);color:var(--dark)}
.summary{display:none;margin-top:16px;padding:14px;border-radius:10px;line-height:1.5}
.summary.ready{display:block;background:var(--dark);color:var(--light);border:2px solid var(--dark)}
.summary.incomplete{display:block;background:var(--light);color:var(--dark);border:2px solid var(--dark)}
@media(max-width:600px){body{padding:10px}.container{padding:14px}h1{font-size:1.3rem}button{font-size:16px;flex:1 1 140px}.check-item{padding:12px}}
</style>
</head>
<body>
<main class="container">
<h1>Project Plan Checklist</h1>
<div class="instructions"><strong>Complete each check before finalising your submission.</strong> Tick each item once you have confirmed it is addressed.</div>

<div class="progress-wrap">
  <div class="progress-row">
    <span id="progressText">0 of 6 checks completed</span>
    <span id="statusText">Checklist incomplete</span>
  </div>
  <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="checklist" id="checklist">
  <div class="check-item"><input type="checkbox" id="check1"><label for="check1">Include an executive summary, evidence-based case for change, one aim and 3–5 SMART objectives.</label></div>
  <div class="check-item"><input type="checkbox" id="check2"><label for="check2">Address stakeholders, human-centred design, governance, ethics, legal requirements, cybersecurity, interoperability and technical architecture.</label></div>
  <div class="check-item"><input type="checkbox" id="check3"><label for="check3">Confirm scope, methodology, workplan, milestones, resources, budget, change management, training and communications.</label></div>
  <div class="check-item"><input type="checkbox" id="check4"><label for="check4">Include risk, safety and quality management; KPIs, benefits realisation, sustainability, anticipated impact and next steps.</label></div>
  <div class="check-item"><input type="checkbox" id="check5"><label for="check5">Incorporate Assessment 2 feedback; check consistency and include required supporting materials, including the architecture diagram, timeline and risk register.</label></div>
  <div class="check-item"><input type="checkbox" id="check6"><label for="check6">Check 20–30 high-quality references, APA 7 accuracy, proofreading, confidentiality and any required AI-use declaration.</label></div>
</div>

<div class="buttons">
  <button type="button" class="primary" id="reviewBtn">Review readiness</button>
  <button type="button" class="secondary" id="resetBtn">Reset</button>
</div>

<div id="summary" class="summary" aria-live="polite"></div>
</main>

<script>
const boxes=[...document.querySelectorAll('#checklist input[type="checkbox"]')];
const progressText=document.getElementById('progressText');
const statusText=document.getElementById('statusText');
const progressBar=document.getElementById('progressBar');
const summary=document.getElementById('summary');

function updateProgress(){
  const complete=boxes.filter(b=>b.checked).length;
  progressText.textContent=complete+' of '+boxes.length+' checks completed';
  statusText.textContent=complete===boxes.length?'Ready for final review':'Checklist incomplete';
  progressBar.style.width=((complete/boxes.length)*100)+'%';
  boxes.forEach(b=>b.closest('.check-item').classList.toggle('complete',b.checked));
  summary.className='summary';
  summary.textContent='';
}

boxes.forEach(b=>b.addEventListener('change',updateProgress));

document.getElementById('reviewBtn').addEventListener('click',()=>{
  const complete=boxes.filter(b=>b.checked).length;
  if(complete===boxes.length){
    summary.className='summary ready';
    summary.innerHTML='<strong>All checks complete.</strong> Your project plan is ready for final review.';
  }else{
    const remaining=boxes.length-complete;
    summary.className='summary incomplete';
    summary.innerHTML='<strong>'+remaining+' check'+(remaining===1?'':'s')+' remaining.</strong> Review the unticked items before finalising your submission.';
  }
});

document.getElementById('resetBtn').addEventListener('click',()=>{
  boxes.forEach(b=>b.checked=false);
  updateProgress();
});

updateProgress();
</script>
</body>
</html>
